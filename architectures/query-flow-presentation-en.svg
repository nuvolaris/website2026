<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Search AI agent - query flow, presentation version</title>
  <desc id="desc">Simplified diagram with chat frontend, OPS orchestrator, controlled tools, AI response, and storage/models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f6f8"/>
      <stop offset="0.52" stop-color="#edf6f1"/>
      <stop offset="1" stop-color="#f8f1e7"/>
    </linearGradient>
    <linearGradient id="ops" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5f5ed"/>
      <stop offset="1" stop-color="#dceff7"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#182c34" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334d58"/>
    </marker>
    <marker id="arrowStart" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#334d58"/>
    </marker>
    <style>
      .page { fill: url(#bg); }
      .kicker { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #76511f; letter-spacing: 0.08em; }
      .title { font: 760 46px Georgia, "Times New Roman", serif; fill: #18272f; }
      .subtitle { font: 20px Verdana, Geneva, sans-serif; fill: #51666d; }
      .panel { fill: rgba(255,255,255,0.76); stroke: #d5ddd9; stroke-width: 1.4; rx: 18; filter: url(#shadow); }
      .panelOps { fill: url(#ops); stroke: #85c1a7; stroke-width: 1.8; rx: 18; filter: url(#shadow); }
      .laneTitle { font: 700 19px Verdana, Geneva, sans-serif; fill: #19323b; }
      .laneNote { font: 13px Verdana, Geneva, sans-serif; fill: #657578; }
      .card { fill: #ffffff; stroke: #cfdad9; stroke-width: 1.2; rx: 12; }
      .cardOps { fill: #fbfffd; stroke: #79b99b; stroke-width: 1.5; rx: 12; }
      .cardWarm { fill: #fffdf7; stroke: #dac88e; stroke-width: 1.5; rx: 12; }
      .cardTitle { font: 700 18px Verdana, Geneva, sans-serif; fill: #1d3037; }
      .cardText { font: 14px Verdana, Geneva, sans-serif; fill: #52666c; }
      .tag { fill: #193b34; rx: 9; }
      .tagText { font: 700 12px Verdana, Geneva, sans-serif; fill: #eefbf5; letter-spacing: 0.03em; }
      .flow { fill: none; stroke: #334d58; stroke-width: 4; stroke-linecap: round; marker-start: url(#arrowStart); marker-end: url(#arrowEnd); }
      .flowThin { fill: none; stroke: #789493; stroke-width: 2.5; stroke-linecap: round; marker-start: url(#arrowStart); marker-end: url(#arrowEnd); }
      .footer { font: 13px Verdana, Geneva, sans-serif; fill: #728083; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1600" height="900"/>

  <text class="kicker" x="80" y="72">PRESENTATION VERSION</text>
  <text class="title" x="80" y="126">Search AI agent - query flow</text>
  <text class="subtitle" x="80" y="163">Simplified conversational flow: OPS orchestration, controlled tools, evidence, and structured response.</text>

  <rect class="panel" x="70" y="220" width="245" height="500"/>
  <text class="laneTitle" x="100" y="263">Frontend chat</text>
  <text class="laneNote" x="100" y="286">user experience</text>

  <rect class="cardWarm" x="95" y="312" width="195" height="82"/>
  <text class="cardTitle" x="120" y="348">User</text>
  <text class="cardText" x="120" y="373">free-form request</text>

  <rect class="card" x="95" y="424" width="195" height="82"/>
  <text class="cardTitle" x="120" y="460">React / Vite</text>
  <text class="cardText" x="120" y="485">chat and active filters</text>

  <rect class="card" x="95" y="536" width="195" height="82"/>
  <text class="cardTitle" x="120" y="572">UI response</text>
  <text class="cardText" x="120" y="597">table and follow-up</text>

  <rect class="panelOps" x="365" y="220" width="260" height="500"/>
  <text class="laneTitle" x="395" y="263">Orchestrator</text>
  <text class="laneNote" x="395" y="286">rag/get_agents</text>
  <rect class="tag" x="520" y="188" width="70" height="24"/>
  <text class="tagText" x="535" y="205">OPS</text>

  <rect class="cardOps" x="395" y="312" width="200" height="82"/>
  <text class="cardTitle" x="420" y="348">Load config</text>
  <text class="cardText" x="420" y="373">instructions and context</text>

  <rect class="cardOps" x="395" y="424" width="200" height="82"/>
  <text class="cardTitle" x="420" y="460">Structured parse</text>
  <text class="cardText" x="420" y="485">search fields</text>

  <rect class="cardOps" x="395" y="536" width="200" height="82"/>
  <text class="cardTitle" x="420" y="572">Ask-back gate</text>
  <text class="cardText" x="420" y="597">missing questions</text>

  <rect class="panelOps" x="675" y="220" width="270" height="500"/>
  <text class="laneTitle" x="705" y="263">Controlled tools</text>
  <text class="laneNote" x="705" y="286">SQL helpers and search</text>
  <rect class="tag" x="840" y="188" width="70" height="24"/>
  <text class="tagText" x="855" y="205">OPS</text>

  <rect class="cardOps" x="705" y="300" width="210" height="76"/>
  <text class="cardTitle" x="730" y="334">list_agent_types</text>
  <text class="cardText" x="730" y="358">canonical values</text>

  <rect class="cardOps" x="705" y="402" width="210" height="76"/>
  <text class="cardTitle" x="730" y="436">expand_products</text>
  <text class="cardText" x="730" y="460">product domain</text>

  <rect class="cardOps" x="705" y="504" width="210" height="76"/>
  <text class="cardTitle" x="730" y="538">search_agents</text>
  <text class="cardText" x="730" y="562">candidate buyers</text>

  <rect class="cardOps" x="705" y="606" width="210" height="76"/>
  <text class="cardTitle" x="730" y="640">classify outcome</text>
  <text class="cardText" x="730" y="664">matches and fallbacks</text>

  <rect class="panel" x="995" y="220" width="245" height="500"/>
  <text class="laneTitle" x="1025" y="263">Evidence and AI</text>
  <text class="laneNote" x="1025" y="286">controlled response</text>

  <rect class="card" x="1020" y="312" width="195" height="82"/>
  <text class="cardTitle" x="1045" y="348">Evidence bundle</text>
  <text class="cardText" x="1045" y="373">samples and counts</text>

  <rect class="cardWarm" x="1020" y="424" width="195" height="82"/>
  <text class="cardTitle" x="1045" y="460">AI composer</text>
  <text class="cardText" x="1045" y="485">explainable text</text>

  <rect class="card" x="1020" y="536" width="195" height="82"/>
  <text class="cardTitle" x="1045" y="572">Contract</text>
  <text class="cardText" x="1045" y="597">JSON for the UI</text>

  <rect class="panelOps" x="1290" y="220" width="245" height="500"/>
  <text class="laneTitle" x="1320" y="263">Storage and models</text>
  <text class="laneNote" x="1320" y="286">data services</text>
  <rect class="tag" x="1430" y="188" width="70" height="24"/>
  <text class="tagText" x="1445" y="205">OPS</text>

  <rect class="cardOps" x="1315" y="300" width="195" height="76"/>
  <text class="cardTitle" x="1340" y="334">SQL Server</text>
  <text class="cardText" x="1340" y="358">agent dataset</text>

  <rect class="cardOps" x="1315" y="402" width="195" height="76"/>
  <text class="cardTitle" x="1340" y="436">Redis</text>
  <text class="cardText" x="1340" y="460">recent queries</text>

  <rect class="cardOps" x="1315" y="504" width="195" height="76"/>
  <text class="cardTitle" x="1340" y="538">PostgreSQL</text>
  <text class="cardText" x="1340" y="562">AI instructions</text>

  <rect class="cardOps" x="1315" y="606" width="195" height="76"/>
  <text class="cardTitle" x="1340" y="640">LLM / load_2</text>
  <text class="cardText" x="1340" y="664">model and index</text>

  <path class="flow" d="M 315 450 C 345 450 335 450 365 450"/>
  <path class="flow" d="M 625 450 C 655 450 645 450 675 450"/>
  <path class="flow" d="M 945 450 C 975 450 965 450 995 450"/>
  <path class="flow" d="M 1240 450 C 1270 450 1260 450 1290 450"/>

  <path class="flowThin" d="M 193 394 C 193 409 193 409 193 424"/>
  <path class="flowThin" d="M 193 506 C 193 521 193 521 193 536"/>
  <path class="flowThin" d="M 495 394 C 495 409 495 409 495 424"/>
  <path class="flowThin" d="M 495 506 C 495 521 495 521 495 536"/>
  <path class="flowThin" d="M 810 376 C 810 389 810 389 810 402"/>
  <path class="flowThin" d="M 810 478 C 810 491 810 491 810 504"/>
  <path class="flowThin" d="M 810 580 C 810 593 810 593 810 606"/>
  <path class="flowThin" d="M 1118 394 C 1118 409 1118 409 1118 424"/>
  <path class="flowThin" d="M 1118 506 C 1118 521 1118 521 1118 536"/>

  <text class="footer" x="80" y="812">Static presentation snapshot. The source technical diagram remains docs/query-flow.svg.</text>
</svg>
